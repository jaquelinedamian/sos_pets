      <form method="POST">
                {% csrf_token %}                
                <div class="form-group">
                    <label for="{{ form.username.id_for_label }}">Nome de Usuário:</label><br>
                    {{ form.username }}
                </div>
                
                <div class="form-group">
                    <label for="{{ form.password.id_for_label }}">Senha:</label><br>
                    {{ form.password }}
                </div>
            
                <br>
                <button type="submit" class="btn btn-primary btn-block">Entrar</button>
            
                {% if messages %}
                <ul class="mt-3">
                    {% for message in messages %}
                    <li class="text-danger">{{ message }}</li>
                    {% endfor %}
                </ul>
                {% endif %}
            </form>
