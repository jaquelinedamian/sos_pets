
{% load static %} <!-- Carregar as tags estáticas -->
{% include 'core/header.html' %}

<div class="container">
    <div class="form-container">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="container">
                <div class="row">
                    <div class="col-sm-6">
                        <img src="{% static 'img/Cadastro.png' %}" alt="Logo sos pets" width="70%">
                    </div>
                    <div class="col-sm-6">
                        <h1>Cadastro de Usuário</h1>

                        <div class="form-group">
                            <label for="nome">Nome:</label>
                            <input type="text" id="nome" name="nome" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone:</label>
                            <input type="tel" id="telefone" name="telefone" placeholder="Apenas números" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="rede_social">Rede social:</label>
                            <input type="text" id="rede_social" name="rede_social" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="foto">Foto:</label>
                            <input type="file" id="foto" name="foto" accept="image/*" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="senha">Senha:</label>
                            <input type="password" id="senha" name="senha" class="form-control" required>
                        </div>
                        <br>
                        <div class="form-group">
                            <div class="row">
                                <table style="border: none;">
                                    <tr>
                                        <td>
                                            <p>
                                            <input type="checkbox" class="form-check-input" id="termos" name="termos" required style="margin-left: 10px;">
                                       </p>
                                        </td>
                                        <td>
                                            <p style="margin-left: 20px;">Concordo com os 
                                            <a href="{% url 'termos' %}" target="_blank">termos e condições</a> 
                                            e a 
                                            <a href="{% url 'politica' %}" target="_blank">política de privacidade</a>.
                                            </p>
                                        </td>
                                    </tr>
                                </table>
                            </div>
                        </div>

                        <br>
                        <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

{% if messages %}
    {% for message in messages %}
        <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

{% include 'core/footer.html' %}
